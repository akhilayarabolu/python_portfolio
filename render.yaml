databases:
  - name: portfolio-db
    plan: free
    databaseName: portfolio
    user: portfolio

services:
  - type: web
    name: akhila-python-portfolio
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn -c gunicorn.conf.py portfolio.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: GITHUB_URL
        value: https://github.com/YOUR_GITHUB_USERNAME
      - key: LINKEDIN_URL
        value: https://www.linkedin.com/in/YOUR_LINKEDIN
      - key: CONTACT_EMAIL
        value: your.email@example.com
